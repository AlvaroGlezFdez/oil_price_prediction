# El día 1 de cada mes: descarga los datos y reentrena el modelo de producción con todos
# los datos (misma configuración; no se vuelven a buscar hiperparámetros). Exporta y publica.
name: Reentrenar modelo

on:
  schedule:
    - cron: "0 5 1 * *"      # día 1 de cada mes, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizacion-repo
  cancel-in-progress: false

jobs:
  reentrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias (torch CPU)
        run: pip install -r requirements.txt

      - name: Descargar datos
        run: python -m src.download

      - name: Reentrenar el modelo de producción y predecir
        run: python -m src.produccion

      - name: Exportar JSON de la web
        run: python -m src.exportar_web

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models/produccion results/prediccion_actual.json web/data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore: reentrenamiento mensual del modelo de producción"
            git push
          fi
