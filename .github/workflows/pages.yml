# Publica la carpeta web/ en GitHub Pages.
# Se lanza con cada push que cambie web/ y también al terminar los workflows de actualización
# (sus push con GITHUB_TOKEN no disparan otros workflows por sí solos).
name: Publicar web

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_run:
    workflows: ["Actualizar datos y previsión", "Reentrenar modelo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: despliegue
        uses: actions/deploy-pages@v4
